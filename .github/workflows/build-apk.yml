name: Build TahaDento APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tahadento-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TahaDento_AM_XML_Batcher_v5_SMART_SUCCESS.zip"

          if [[ ! -f "$ZIP" ]]; then
            echo "::error::Missing $ZIP in repository root."
            exit 1
          fi

          echo "ZIP found:"
          ls -lh "$ZIP"

          unzip -tq "$ZIP"
          echo "ZIP integrity check passed."

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -q TahaDento_AM_XML_Batcher_v5_SMART_SUCCESS.zip -d extracted

          PROJECT_DIR="$(
            find extracted \
              -type f \
              -name settings.gradle \
              -not -path '*/.gradle/*' \
              -print -quit
          )"

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::settings.gradle was not found inside the ZIP."
            find extracted -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Android app module was not found."
            echo "Expected: $PROJECT_DIR/app/build.gradle"
            find "$PROJECT_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager)"

          echo "sdkmanager: $SDKMANAGER"
          sdkmanager --version

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed | grep -E \
            'platform-tools|platforms;android-35|build-tools;35.0.0' || true

      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          java -version

          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"

          adb version
          sdkmanager --version

          ls -la "$ANDROID_SDK_ROOT/platforms/android-35"
          ls -la "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Build TahaDento APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Gradle version:"
          gradle --version

          echo "Building TahaDento..."

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "$APK" ]]; then
            echo "::error::APK was not produced."
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -maxdepth 6 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TahaDento-AM-XML-Batcher-V5-Smart-Success
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TahaDento-build-diagnostics
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
